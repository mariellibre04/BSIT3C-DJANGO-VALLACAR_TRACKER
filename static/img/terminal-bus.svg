      <stop offset=".78" stop-color="#f2ecdf"/>
      <stop offset="1" stop-color="#e7dfd2"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db6a5"/>
      <stop offset="1" stop-color="#7d9988"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f2f5f9"/>
      <stop offset="1" stop-color="#ccd6e2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
