<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Vallacar Transit Ceres Liner emblem">
  <defs>
    <linearGradient id="ceresTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEE4A"/>
      <stop offset=".55" stop-color="#FFE000"/>
      <stop offset="1" stop-color="#FFC800"/>
    </linearGradient>
    <linearGradient id="ceresChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".16" stop-color="#F2F6F9"/>
      <stop offset=".38" stop-color="#AEB9C4"/>
      <stop offset=".5" stop-color="#E9EEF3"/>
      <stop offset=".66" stop-color="#8C99A6"/>
      <stop offset=".84" stop-color="#DDE5EC"/>
      <stop offset="1" stop-color="#F7FAFC"/>
    </linearGradient>
    <linearGradient id="ceresChromeLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#D6DEE6"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="ceresChromeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F7C89"/>
      <stop offset=".5" stop-color="#C9D2DA"/>
      <stop offset="1" stop-color="#5D6976"/>
    </linearGradient>
    <linearGradient id="ceresGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".3"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ceresDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#3A2B00" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="38" fill="url(#ceresTile)"/>
  <rect width="256" height="256" rx="38" fill="url(#ceresGloss)"/>

  <g filter="url(#ceresDrop)">
    <ellipse cx="128" cy="128" rx="96" ry="72" fill="none" stroke="#2C3540" stroke-width="17"/>
    <ellipse cx="128" cy="128" rx="96" ry="72" fill="none" stroke="url(#ceresChrome)" stroke-width="12"/>
    <ellipse cx="128" cy="128" rx="96" ry="72" fill="none" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="2"/>

    <path d="M63 83h33l32 70 32-70h33l-52 106h-26L63 83Z"
          fill="url(#ceresChrome)" stroke="#303A45" stroke-width="4"
          stroke-linejoin="round"/>
    <path d="M80 92h18l30 66 30-66h18l-42 87h-12L80 92Z"
          fill="url(#ceresChromeLight)" stroke="#8B97A3" stroke-width="1.6"
          stroke-linejoin="round" stroke-opacity=".65"/>
    <path d="M128 101 151 133 128 162 105 133 128 101Z"
          fill="url(#ceresChromeDark)" stroke="#303A45" stroke-width="2.6"
          stroke-linejoin="round"/>
    <path d="M128 110 143 131 128 150 113 131 128 110Z"
          fill="url(#ceresChromeLight)" opacity=".9"/>
  </g>
</svg>
