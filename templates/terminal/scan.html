{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f9">
  <meta name="description" content="Terminal staff bus QR scanner for Vallacar Tracker.">
  <title>Terminal Scanner &middot; Vallacar Tracker</title>
  <link rel="icon" href="{% static 'favicon-dev.ico' %}" type="image/x-icon">
  <link rel="shortcut icon" href="{% static 'favicon-dev.ico' %}" type="image/x-icon">
  <link href="{% static 'css/terminal-scan.css' %}" rel="stylesheet">
  <style>@import url("https://rsms.me/inter/inter.css");</style>
</head>
<body>
  <main class="scanner-shell">
    <header class="identity-card">
      <button class="menu-button" type="button" aria-label="Open terminal menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h10"/>
        </svg>
      </button>
      <div class="identity-copy">
        <span class="identity-eyebrow">You are:</span>
        <strong class="identity-name">{{ terminal_label }} <span>Terminal</span></strong>
      </div>
      <div class="identity-user">
        <span class="user-avatar" aria-hidden="true">TS</span>
        <time class="identity-time" id="terminalClock">09:41</time>
      </div>
    </header>

    <div class="mode-switch" role="tablist" aria-label="Bus scan mode">
      <button class="mode-btn mode-in is-active" type="button" data-mode="IN" role="tab" aria-selected="true">
        <span class="mode-label">BUS ARRIVED (IN)</span>
        <span class="mode-state"><span class="mode-dot"></span> SELECTED</span>
      </button>
      <button class="mode-btn mode-out" type="button" data-mode="OUT" role="tab" aria-selected="false">
        <span class="mode-label">BUS LEFT (OUT)</span>
        <span class="mode-state"><span class="mode-dot"></span> SELECTED</span>
      </button>
    </div>

    <section class="camera-card" id="cameraCard" aria-label="Bus QR camera preview">
      <img class="camera-bus" src="{% static 'img/terminal-bus.svg' %}" alt="Vallacar bus waiting at the terminal">

      <div class="camera-tint"></div>
      <div class="camera-grid" aria-hidden="true"></div>

      <div class="camera-topline">
        <span class="camera-chip"><span class="dot"></span> Camera ready</span>
        <span class="camera-chip mode-badge" id="modeBadge">IN</span>
      </div>

      <div class="scanner-frame" aria-hidden="true">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <span class="scan-beam"></span>
        <div class="qr-overlay">
          <svg viewBox="0 0 29 29" shape-rendering="crispEdges" fill="#2563eb" role="img" aria-label="Bus QR code">
            <rect width="29" height="29" fill="#ffffff"/>
            <g>
              <rect x="0" y="0" width="7" height="7"/>
              <rect x="1" y="1" width="5" height="5" fill="#ffffff"/>
              <rect x="2" y="2" width="3" height="3"/>
              <rect x="22" y="0" width="7" height="7"/>
              <rect x="23" y="1" width="5" height="5" fill="#ffffff"/>
              <rect x="24" y="2" width="3" height="3"/>
              <rect x="0" y="22" width="7" height="7"/>
              <rect x="1" y="23" width="5" height="5" fill="#ffffff"/>
              <rect x="2" y="24" width="3" height="3"/>
            </g>
            <path d="M8 0h1v1h-1zM9 0h1v1h-1zM11 0h1v1h-1zM13 0h1v1h-1zM14 0h1v1h-1zM16 0h1v1h-1zM17 0h1v1h-1zM18 0h1v1h-1zM19 0h1v1h-1zM20 0h1v1h-1zM9 1h1v1h-1zM10 1h1v1h-1zM14 1h1v1h-1zM16 1h1v1h-1zM18 1h1v1h-1zM19 1h1v1h-1zM20 1h1v1h-1zM8 2h1v1h-1zM10 2h1v1h-1zM13 2h1v1h-1zM15 2h1v1h-1zM16 2h1v1h-1zM17 2h1v1h-1zM19 2h1v1h-1zM20 2h1v1h-1zM9 3h1v1h-1zM10 3h1v1h-1zM13 3h1v1h-1zM18 3h1v1h-1zM20 3h1v1h-1zM8 4h1v1h-1zM10 4h1v1h-1zM12 4h1v1h-1zM17 4h1v1h-1zM8 5h1v1h-1zM13 5h1v1h-1zM18 5h1v1h-1zM19 5h1v1h-1zM8 7h1v1h-1zM10 7h1v1h-1zM11 7h1v1h-1zM12 7h1v1h-1zM14 7h1v1h-1zM15 7h1v1h-1zM16 7h1v1h-1zM18 7h1v1h-1zM19 7h1v1h-1zM3 8h1v1h-1zM4 8h1v1h-1zM5 8h1v1h-1zM9 8h1v1h-1zM10 8h1v1h-1zM11 8h1v1h-1zM12 8h1v1h-1zM15 8h1v1h-1zM16 8h1v1h-1zM17 8h1v1h-1zM18 8h1v1h-1zM25 8h1v1h-1zM1 9h1v1h-1zM2 9h1v1h-1zM3 9h1v1h-1zM5 9h1v1h-1zM7 9h1v1h-1zM8 9h1v1h-1zM9 9h1v1h-1zM10 9h1v1h-1zM11 9h1v1h-1zM12 9h1v1h-1zM13 9h1v1h-1zM14 9h1v1h-1zM15 9h1v1h-1zM16 9h1v1h-1zM19 9h1v1h-1zM20 9h1v1h-1zM21 9h1v1h-1zM22 9h1v1h-1zM23 9h1v1h-1zM28 9h1v1h-1zM0 10h1v1h-1zM1 10h1v1h-1zM2 10h1v1h-1zM4 10h1v1h-1zM5 10h1v1h-1zM9 10h1v1h-1zM11 10h1v1h-1zM16 10h1v1h-1zM17 10h1v1h-1zM18 10h1v1h-1zM22 10h1v1h-1zM23 10h1v1h-1zM1 11h1v1h-1zM3 11h1v1h-1zM4 11h1v1h-1zM5 11h1v1h-1zM7 11h1v1h-1zM8 11h1v1h-1zM11 11h1v1h-1zM15 11h1v1h-1zM16 11h1v1h-1zM17 11h1v1h-1zM18 11h1v1h-1zM19 11h1v1h-1zM26 11h1v1h-1zM3 12h1v1h-1zM5 12h1v1h-1zM9 12h1v1h-1zM10 12h1v1h-1zM13 12h1v1h-1zM14 12h1v1h-1zM15 12h1v1h-1zM18 12h1v1h-1zM22 12h1v1h-1zM24 12h1v1h-1zM25 12h1v1h-1zM1 13h1v1h-1zM4 13h1v1h-1zM5 13h1v1h-1zM7 13h1v1h-1zM8 13h1v1h-1zM10 13h1v1h-1zM11 13h1v1h-1zM12 13h1v1h-1zM14 13h1v1h-1zM15 13h1v1h-1zM18 13h1v1h-1zM23 13h1v1h-1zM24 13h1v1h-1zM25 13h1v1h-1zM26 13h1v1h-1zM28 13h1v1h-1zM3 14h1v1h-1zM8 14h1v1h-1zM10 14h1v1h-1zM11 14h1v1h-1zM17 14h1v1h-1zM22 14h1v1h-1zM0 15h1v1h-1zM4 15h1v1h-1zM5 15h1v1h-1zM7 15h1v1h-1zM8 15h1v1h-1zM9 15h1v1h-1zM10 15h1v1h-1zM14 15h1v1h-1zM17 15h1v1h-1zM20 15h1v1h-1zM22 15h1v1h-1zM26 15h1v1h-1zM27 15h1v1h-1zM0 16h1v1h-1zM1 16h1v1h-1zM2 16h1v1h-1zM4 16h1v1h-1zM7 16h1v1h-1zM8 16h1v1h-1zM9 16h1v1h-1zM12 16h1v1h-1zM16 16h1v1h-1zM17 16h1v1h-1zM18 16h1v1h-1zM20 16h1v1h-1zM21 16h1v1h-1zM22 16h1v1h-1zM25 16h1v1h-1zM26 16h1v1h-1zM1 17h1v1h-1zM2 17h1v1h-1zM4 17h1v1h-1zM5 17h1v1h-1zM10 17h1v1h-1zM12 17h1v1h-1zM14 17h1v1h-1zM15 17h1v1h-1zM18 17h1v1h-1zM19 17h1v1h-1zM21 17h1v1h-1zM22 17h1v1h-1zM23 17h1v1h-1zM24 17h1v1h-1zM25 17h1v1h-1zM26 17h1v1h-1zM27 17h1v1h-1zM0 18h1v1h-1zM2 18h1v1h-1zM3 18h1v1h-1zM4 18h1v1h-1zM5 18h1v1h-1zM7 18h1v1h-1zM10 18h1v1h-1zM13 18h1v1h-1zM15 18h1v1h-1zM18 18h1v1h-1zM22 18h1v1h-1zM26 18h1v1h-1zM27 18h1v1h-1zM28 18h1v1h-1zM0 19h1v1h-1zM1 19h1v1h-1zM3 19h1v1h-1zM4 19h1v1h-1zM5 19h1v1h-1zM10 19h1v1h-1zM11 19h1v1h-1zM12 19h1v1h-1zM13 19h1v1h-1zM14 19h1v1h-1zM15 19h1v1h-1zM16 19h1v1h-1zM20 19h1v1h-1zM22 19h1v1h-1zM23 19h1v1h-1zM24 19h1v1h-1zM25 19h1v1h-1zM28 19h1v1h-1zM1 20h1v1h-1zM2 20h1v1h-1zM3 20h1v1h-1zM4 20h1v1h-1zM5 20h1v1h-1zM7 20h1v1h-1zM8 20h1v1h-1zM9 20h1v1h-1zM16 20h1v1h-1zM17 20h1v1h-1zM19 20h1v1h-1zM22 20h1v1h-1zM28 20h1v1h-1zM17 21h1v1h-1zM18 21h1v1h-1zM19 21h1v1h-1zM20 21h1v1h-1zM21 21h1v1h-1zM28 21h1v1h-1zM13 22h1v1h-1zM15 22h1v1h-1zM16 22h1v1h-1zM17 22h1v1h-1zM19 22h1v1h-1zM23 22h1v1h-1zM8 23h1v1h-1zM9 23h1v1h-1zM10 23h1v1h-1zM12 23h1v1h-1zM14 23h1v1h-1zM15 23h1v1h-1zM16 23h1v1h-1zM20 23h1v1h-1zM24 23h1v1h-1zM26 23h1v1h-1zM8 24h1v1h-1zM9 24h1v1h-1zM12 24h1v1h-1zM13 24h1v1h-1zM14 24h1v1h-1zM16 24h1v1h-1zM18 24h1v1h-1zM21 24h1v1h-1zM26 24h1v1h-1zM8 25h1v1h-1zM9 25h1v1h-1zM11 25h1v1h-1zM12 25h1v1h-1zM13 25h1v1h-1zM14 25h1v1h-1zM15 25h1v1h-1zM17 25h1v1h-1zM20 25h1v1h-1zM24 25h1v1h-1zM25 25h1v1h-1zM26 25h1v1h-1zM8 26h1v1h-1zM9 26h1v1h-1zM10 26h1v1h-1zM11 26h1v1h-1zM12 26h1v1h-1zM14 26h1v1h-1zM16 26h1v1h-1zM17 26h1v1h-1zM19 26h1v1h-1zM20 26h1v1h-1zM8 27h1v1h-1zM10 27h1v1h-1zM13 27h1v1h-1zM14 27h1v1h-1zM16 27h1v1h-1zM18 27h1v1h-1zM19 27h1v1h-1zM22 27h1v1h-1zM24 27h1v1h-1zM26 27h1v1h-1zM27 27h1v1h-1zM28 27h1v1h-1zM8 28h1v1h-1zM11 28h1v1h-1zM14 28h1v1h-1zM           </svg>
        </div>
      </div>

      <div class="scanner-reader" id="scanner_reader"></div>

      <div class="scan-feedback" id="scanFeedback" role="status" aria-live="polite" hidden>
        <span class="feedback-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 11v5M12 8h.01"/>
          </svg>
        </span>
        <span class="feedback-copy">
          <strong id="feedbackTitle">Ready</strong>
          <span id="feedbackText"></span>
        </span>
      </div>

      <div class="camera-caption">
        <svg class="inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/>
          <rect x="8" y="8" width="8" height="8" rx="1.5"/>
        </svg>
        <span>Align the bus QR inside the frame</span>
      </div>
    </section>

    <button class="scan-cta" id="scanButton" type="button">
      <svg class="inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/>
        <rect x="8" y="8" width="8" height="8" rx="1.5"/>
      </svg>
      <span id="scanButtonLabel">SCAN BUS QR</span>
    </button>

    <p class="helper-text" id="helperText">Point the camera at the bus QR code to check-in arrival</p>
  </main>

  <form hidden aria-hidden="true">{% csrf_token %}</form>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    (function () {
      var TERMINAL_ID = "{{ terminal_id|escapejs }}";
      var CHECKIN_URL = "{% url 'terminal_checkin_api' %}";
      var csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
      var csrfToken = csrfInput ? csrfInput.value : '{{ csrf_token }}';

      var clockEl = document.getElementById('terminalClock');
      var cameraCard = document.getElementById('cameraCard');
      var modeBadge = document.getElementById('modeBadge');
      var helperText = document.getElementById('helperText');
      var scanButton = document.getElementById('scanButton');
      var scanButtonLabel = document.getElementById('scanButtonLabel');
      var feedback = document.getElementById('scanFeedback');
      var feedbackTitle = document.getElementById('feedbackTitle');
      var feedbackText = document.getElementById('feedbackText');
      var modeButtons = Array.prototype.slice.call(document.querySelectorAll('.mode-btn'));

      var mode = 'IN';
      var scanner = null;
      var scanning = false;
      var busy = false;
      var cooldownUntil = 0;
      var lastScanKey = '';
      var lastScanAt = 0;

      function tickClock() {
        var now = new Date();
        var hours = String(now.getHours()).padStart(2, '0');
        var minutes = String(now.getMinutes()).padStart(2, '0');
        clockEl.textContent = hours + ':' + minutes;
      }

      function setMode(nextMode) {
        mode = nextMode === 'OUT' ? 'OUT' : 'IN';
        modeButtons.forEach(function (button) {
          var active = button.getAttribute('data-mode') === mode;
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        modeBadge.textContent = mode;
        modeBadge.classList.toggle('is-out', mode === 'OUT');
        cameraCard.classList.remove('is-success');
        helperText.textContent = mode === 'IN'
          ? 'Point the camera at the bus QR code to check-in arrival'
          : 'Point the camera at the bus QR code to check-out departure';
        hideFeedback();
      }

      function showFeedback(kind, title, message) {
        feedback.hidden = false;
        feedback.className = 'scan-feedback' + (kind ? ' is-' + kind : '');
        feedbackTitle.textContent = title;
        feedbackText.textContent = message || '';
        var icons = {
          success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></svg>',
          error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.2M12 16.4h.01"/></svg>',
          info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
        };
        feedback.querySelector('.feedback-icon').innerHTML = icons[kind] || icons.info;
      }

      function hideFeedback() {
        feedback.hidden = true;
      }

      function extractBusId(decodedText) {
        var text = String(decodedText || '').trim();
        if (!text) return '';
        try {
          var parsed = JSON.parse(text);
          if (parsed && (parsed.bus_id || parsed.id || parsed.token)) {
            return String(parsed.bus_id || parsed.id || parsed.token);
          }
        } catch (error) {
          return codeFromText(text);
        }
        return codeFromText(text);
      }

      function codeFromText(text) {
        var uuid = text.match(/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/);
        return uuid ? uuid[0] : text;
      }

      function cameraErrorMessage(error) {
        var name = (error && error.name) || '';
        var message = (error && error.message) || (typeof error === 'string' ? error : '');
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || /permission|denied|not allowed/i.test(message)) {
          return 'Camera access is blocked. Allow the camera in your browser, then try again.';
        }
        if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || /not found|no camera/i.test(message)) {
          return 'No camera was found. Connect a camera and try again.';
        }
        if (name === 'NotReadableError' || name === 'TrackStartError' || /in use|not readable|busy/i.test(message)) {
          return 'The camera is busy. Close other camera apps and try again.';
        }
        return 'Could not start the camera. Check camera permission and try again.';
      }

      function stopScanner() {
        if (!scanner || !scanning) return Promise.resolve();
        return scanner.stop().then(function () {
          scanning = false;
          cameraCard.classList.remove('is-scanning');
          scanButton.classList.remove('is-scanning');
          scanButton.disabled = false;
          scanButtonLabel.textContent = 'SCAN BUS QR';
          try { scanner.clear(); } catch (error) {}
          scanner = null;
        }).catch(function () {
          scanning = false;
          cameraCard.classList.remove('is-scanning');
          scanButton.classList.remove('is-scanning');
          scanButton.disabled = false;
          scanButtonLabel.textContent = 'SCAN BUS QR';
          scanner = null;
        });
      }

      function startCameraWith(cameraConfig, videoConstraints) {
        if (scanner) {
          try { scanner.clear(); } catch (error) {}
        }
        scanner = new Html5Qrcode('scanner_reader', { verbose: false });
        return scanner.start(cameraConfig, {
          fps: 18,
          qrbox: function (width, height) {
            var edge = Math.floor(Math.min(width, height) * 0.7);
            return { width: edge, height: edge };
          },
          disableFlip: false,
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          videoConstraints: videoConstraints
        }, handleScan, function () {});
      }

      async function startScanner() {
        if (busy) return;
        if (!window.Html5Qrcode) {
          showFeedback('error', 'Scanner unavailable', 'The QR scanner library could not load. Check your connection and reload.');
          return;
        }
        if (!window.isSecureContext) {
          showFeedback('error', 'Camera needs HTTPS', 'Open this page from localhost or HTTPS to use the camera.');
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showFeedback('error', 'Camera unsupported', 'Use Chrome, Edge, or Firefox to scan bus QR codes.');
          return;
        }

        scanButton.disabled = true;
        scanButtonLabel.textContent = 'STARTING CAMERA';
        hideFeedback();
        cameraCard.classList.remove('is-success');

        var attempts = [
          {
            camera: { facingMode: 'environment' },
            constraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          },
          {
            camera: { facingMode: 'user' },
            constraints: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
          }
        ];
        var lastError = null;

        for (var i = 0; i < attempts.length; i++) {
          try {
            await startCameraWith(attempts[i].camera, attempts[i].constraints);
            scanning = true;
            cameraCard.classList.add('is-scanning');
            scanButton.classList.add('is-scanning');
            scanButtonLabel.textContent = 'STOP SCANNING';
            scanButton.disabled = false;
            showFeedback('info', 'Camera live', mode === 'IN'
              ? 'Hold the bus QR inside the frame to check-in arrival.'
              : 'Hold the bus QR inside the frame to check-out departure.');
            return;
          } catch (error) {
            lastError = error;
          }
        }

        try {
          var cameras = await Html5Qrcode.getCameras();
          for (var j = 0; j < cameras.length; j++) {
            try {
              await startCameraWith(
                { deviceId: { exact: cameras[j].id } },
                { deviceId: { exact: cameras[j].id }, width: { ideal: 1280 }, height: { ideal: 720 } }
              );
              scanning = true;
              cameraCard.classList.add('is-scanning');
              scanButton.classList.add('is-scanning');
              scanButtonLabel.textContent = 'STOP SCANNING';
              scanButton.disabled = false;
              showFeedback('info', 'Camera live', 'Hold the bus QR inside the frame.');
              return;
            } catch (error) {
              lastError = error;
            }
          }
        } catch (error) {
          if (!lastError) lastError = error;
        }

        scanButton.disabled = false;
        scanButtonLabel.textContent = 'SCAN BUS QR';
        showFeedback('error', 'Camera unavailable', cameraErrorMessage(lastError));
      }

      async function submitScan(decodedText) {
        if (busy) return;
        var busId = extractBusId(decodedText);
        if (!busId) return;
        if (busId === lastScanKey && Date.now() - lastScanAt < 4000) return;

        busy = true;
        lastScanKey = busId;
        lastScanAt = Date.now();
        showFeedback('info', 'Bus QR detected', 'Recording ' + (mode === 'IN' ? 'arrival' : 'departure') + '...');

        try {
          var response = await fetch(CHECKIN_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({
              bus_id: busId,
              type: mode,
              terminal_id: TERMINAL_ID
            })
          });
          var data = await response.json().catch(function () { return {}; });
          if (!response.ok) {
            throw new Error(data.error || 'Could not record this bus scan.');
          }

          cameraCard.classList.add('is-success');
          await stopScanner();
          showFeedback(
            'success',
            mode === 'IN' ? 'Bus checked in' : 'Bus checked out',
            data.message || (data.bus && data.bus.bus_number ? ('Bus ' + data.bus.bus_number + ' recorded.') : 'Bus scan recorded.')
          );
        } catch (error) {
          showFeedback('error', 'Scan not saved', error.message || 'Could not record this bus scan.');
          lastScanKey = '';
          lastScanAt = 0;
        } finally {
          busy = false;
        }
      }

      function handleScan(decodedText) {
        if (busy || Date.now() < cooldownUntil) return;
        cooldownUntil = Date.now() + 1800;
        submitScan(decodedText);
      }

      modeButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          setMode(button.getAttribute('data-mode'));
        });
      });

      scanButton.addEventListener('click', function () {
        if (scanning) {
          stopScanner();
          return;
        }
        startScanner();
      });

      window.addEventListener('beforeunload', function () {
        if (scanner && scanning) {
          scanner.stop().catch(function () {});
        }
      });

      tickClock();
      window.setInterval(tickClock, 15000);
    })();
  </script>
</body>
</html>
