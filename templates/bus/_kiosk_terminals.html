{% for t in kiosk_terminals %}
<div class="k-terminal{% if t.is_active %} active{% endif %}" data-terminal="{{ t.name }}"
     title="{{ t.name }} terminal">
  <div class="k-terminal-head">
    <span class="k-terminal-dot"></span> {{ t.name }}
    {% if t.is_hub %}<span class="k-hub">HUB</span>{% endif %}
  </div>
  <div class="k-terminal-stats">
    <span><strong>{{ t.at_terminal }}</strong> at terminal</span>
    <span class="k-sep"></span>
    <span><strong>{{ t.inbound }}</strong> inbound</span>
  </div>
</div>
{% endfor %}
